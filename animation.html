<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="animation.css">
</head>
<body>
    <button>button</button>
    <div style="animation-timing-function: linear;" align="center">move here</div>
    <div style="animation-timing-function: ease-in;" align="center">move here</div>
    <div style="animation-timing-function: ease-out;" align="center">move here</div>
    <div style="animation-timing-function: ease-in-out;" align="center">move here</div>
    <div style="animation-timing-function: step-start;" align="center">move here</div>
    <div style="animation-timing-function: step-end;" align="center">move here</div>
</body>
</html>
